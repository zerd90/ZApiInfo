name: ZApiInfo
options:
  bundleIdPrefix: com.zapiinfo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ZApiInfo:
    type: application
    platform: macOS
    sources:
      - path: ZApiInfo
        excludes:
          - Info.plist
          - ZApiInfo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zapiinfo.ZApiInfo
        PRODUCT_NAME: ZApiInfo
        INFOPLIST_FILE: ZApiInfo/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ZApiInfo/ZApiInfo.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
